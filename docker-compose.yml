# CorpLang — full stack for local use.
#   docker compose up --build      then open http://localhost:8080
#
# The browser calls the backend directly (VITE_API_URL), so the frontend build
# bakes in http://localhost:8000 and the backend allows the frontend's origin.
# This mirrors the production split (frontend on Vercel, backend on Render/etc.).

services:
  backend:
    build: ./backend
    image: corplang-backend
    environment:
      CORS_ORIGINS: "http://localhost:8080"
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000"
    image: corplang-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
