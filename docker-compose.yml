# CorpLang — full stack.
#   docker compose up --build     then open http://localhost:3000
#
# The browser only ever talks to the frontend; the frontend relays /api/*
# to the backend over the internal network (BACKEND_URL).

services:
  backend:
    build: ./backend
    image: corplang-backend
    environment:
      CORS_ORIGINS: "*"
    expose:
      - "8000"
    # Uncomment to reach the API / its /docs directly from the host:
    # ports:
    #   - "8000:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: corplang-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
